<div data-umg-name="Border_WeaponCard" style="display:flex; flex-direction:column; width:302px; height:706px; padding:6px; border:1px solid #D9D9D9; background-color:transparent">
  <div data-umg-name="Panel_WeaponCard" style="display:flex; flex-direction:column; flex:1; gap:6px; padding:6px; border:1px solid #111111; background-color:#808080">
    <div style="display:flex; flex-direction:column; width:100%; gap:3px">
      <div style="display:flex; flex-direction:row; height:34px; align-items:center; gap:7px">
        <p data-umg-name="Txt_WeaponName" style="margin:0; font-family:'PUBG Headline'; font-size:30px; font-weight:700; color:#FFFFFF">M16</p>
        <p data-umg-name="Txt_WeaponClass" style="margin:0; padding:2px 5px; font-family:'PUBG Headline'; font-size:16px; font-weight:700; color:#FFFFFF; background-color:#080808">돌격소총</p>
      </div>
      <div data-umg-name="Box_AmmoSummary" style="display:flex; flex-direction:row; height:44px; gap:4px; align-items:center">
        <p data-umg-name="Txt_LoadedAmmo" style="margin:0; font-family:'PUBG Headline'; font-size:30px; font-weight:700; color:#FFFFFF">21</p>
        <p data-umg-name="Txt_ReserveAmmo" style="margin:0; padding-top:9px; font-family:'PUBG Headline'; font-size:15px; color:#C8C8C8">40</p>
        <img data-umg-name="Img_AmmoType" src="../assets/ammo-556.png" alt="5.56mm 탄약" style="width:54px; height:54px; object-fit:contain">
      </div>
    </div>
    <div style="display:flex; flex-direction:row; flex:1; gap:6px; overflow:hidden; background-image:url('../assets/weapon-m16-oriented.png'); background-repeat:no-repeat; background-position:center center; background-size:auto 100%">
      <div data-umg-name="Box_AttachmentSockets" style="display:flex; flex-direction:column; flex:0 0 75px; gap:6px; width:75px">
        <button data-umg-name="Btn_MuzzleSlot" data-slot-state="empty" data-socket="muzzle" style="width:75px; height:75px; background-color:#3C3C3C; border:2px solid #FFFFFF"><img src="../assets/attachment-muzzle.png" alt="총구 부착물 실루엣" style="width:67px; height:67px; opacity:0.72"></button>
        <button data-umg-name="Btn_GripSlot" data-slot-state="empty" data-socket="grip" style="width:75px; height:75px; background-color:#3C3C3C; border:2px solid #FFFFFF"><img src="../assets/attachment-grip.png" alt="손잡이 부착물 실루엣" style="width:67px; height:67px; opacity:0.72"></button>
        <button data-umg-name="Btn_MagSlot" data-slot-state="empty" data-socket="mag" style="width:75px; height:75px; background-color:#3C3C3C; border:2px solid #FFFFFF"><img src="../assets/attachment-mag.png" alt="탄창 부착물 실루엣" style="width:67px; height:67px; opacity:0.72"></button>
        <button data-umg-name="Btn_ScopeSlot" data-slot-state="empty" data-socket="scope" style="width:75px; height:75px; background-color:#3C3C3C; border:2px solid #FFFFFF"><img src="../assets/attachment-scope.png" alt="조준경 부착물 실루엣" style="width:67px; height:67px; opacity:0.72"></button>
        <button data-umg-name="Btn_StockSlot" data-slot-state="empty" data-socket="stock" style="width:75px; height:75px; background-color:#3C3C3C; border:2px solid #FFFFFF"><img src="../assets/attachment-stock.png" alt="개머리판 부착물 실루엣" style="width:67px; height:67px; opacity:0.72"></button>
      </div>
      <div data-umg-name="Img_Weapon" role="img" aria-label="Vertical M16 with attachment socket positions" style="display:flex; flex:1"></div>
    </div>
  </div>
</div>
