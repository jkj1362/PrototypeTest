<div data-umg-name="Border_WeaponCard" style="display:flex; flex-direction:column; width:258px; height:911px; padding:6px; border:1px solid #D9D9D9; background-color:transparent">
  <div data-umg-name="Panel_WeaponCard" style="display:flex; flex-direction:column; flex:1; padding:6px; gap:8px; background-color:#474747">
    <div style="display:flex; flex-direction:row; gap:7px; align-items:center">
      <p data-umg-name="Txt_WeaponName" style="font-family:'PUBG Headline'; font-size:30px; font-weight:700; color:#FFFFFF">M16</p>
      <p data-umg-name="Txt_WeaponClass" style="font-family:'PUBG Headline'; font-size:16px; font-weight:700; color:#FFFFFF; background-color:#080808; padding:2px 5px">돌격소총</p>
    </div>
    <div data-umg-name="Box_AmmoSummary" style="display:flex; flex-direction:row; gap:4px; align-items:center">
      <p data-umg-name="Txt_LoadedAmmo" style="font-family:'PUBG Headline'; font-size:30px; font-weight:700; color:#FFFFFF">21</p>
      <p data-umg-name="Txt_ReserveAmmo" style="font-family:'PUBG Headline'; font-size:15px; color:#C8C8C8">40</p>
      <img data-umg-name="Img_AmmoType" src="../assets/ammo-556.png" alt="5.56mm 탄약" style="width:54px; height:54px">
    </div>
    <div data-umg-name="Overlay_WeaponBody" data-umg-type="Overlay" style="display:flex; flex-direction:column; flex:1">
      <div style="display:flex; flex-direction:row; align-items:center; justify-content:center; flex:1">
        <img data-umg-name="Img_Weapon" src="../assets/weapon-m16-oriented.png" alt="M16" style="width:196px; height:620px; object-fit:contain">
      </div>
      <div data-umg-name="Box_AttachmentSockets" style="display:flex; flex-direction:column; gap:6px; width:76px">
        <button data-umg-name="Btn_MuzzleSlot" data-slot-state="empty" data-socket="muzzle" style="width:76px; height:76px; background-color:#3C3C3C; border:2px solid #FFFFFF"><img src="../assets/attachment-muzzle.png" alt="총구 부착물 실루엣" style="width:68px; height:68px; opacity:0.72"></button>
        <button data-umg-name="Btn_GripSlot" data-slot-state="empty" data-socket="grip" style="width:76px; height:76px; background-color:#3C3C3C; border:2px solid #FFFFFF"><img src="../assets/attachment-grip.png" alt="손잡이 부착물 실루엣" style="width:68px; height:68px; opacity:0.72"></button>
        <button data-umg-name="Btn_MagSlot" data-slot-state="empty" data-socket="mag" style="width:76px; height:76px; background-color:#3C3C3C; border:2px solid #FFFFFF"><img src="../assets/attachment-mag.png" alt="탄창 부착물 실루엣" style="width:68px; height:68px; opacity:0.72"></button>
        <button data-umg-name="Btn_ScopeSlot" data-slot-state="empty" data-socket="scope" style="width:76px; height:76px; background-color:#3C3C3C; border:2px solid #FFFFFF"><img src="../assets/attachment-scope.png" alt="조준경 부착물 실루엣" style="width:68px; height:68px; opacity:0.72"></button>
        <button data-umg-name="Btn_StockSlot" data-slot-state="empty" data-socket="stock" style="width:76px; height:76px; background-color:#3C3C3C; border:2px solid #FFFFFF"><img src="../assets/attachment-stock.png" alt="개머리판 부착물 실루엣" style="width:68px; height:68px; opacity:0.72"></button>
      </div>
    </div>
  </div>
</div>
