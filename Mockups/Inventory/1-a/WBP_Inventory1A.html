<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <title>PUBG Console Inventory 1-a Conservative Layout</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; background-color:#2c2c2c; overflow:hidden; }
    button { font:inherit; }

    #preview-stage {
      width:100vw;
      height:100vh;
      overflow:hidden;
      background-color:#2c2c2c;
    }

    #inventory-1a {
      position:relative;
      width:1920px;
      height:1080px;
      overflow:hidden;
      font-family:"PUBG Body", "Arial Narrow", Arial, sans-serif;
      color:#ffffff;
      background-color:#2c2c2c;
    }

    #inventory-1a .screen-title {
      margin:0;
      height:54px;
      font-family:"PUBG Headline", "Arial Narrow", Arial, sans-serif;
      font-size:36px;
      font-weight:700;
      line-height:54px;
      color:#ffffff;
    }

    #inventory-1a .gear-region {
      position:absolute;
      left:1540px;
      top:38px;
      width:347px;
      height:970px;
      display:flex;
      flex-direction:column;
    }

    #inventory-1a .gear-layout {
      display:flex;
      flex-direction:row;
      flex:1;
      gap:4px;
    }

    #inventory-1a .gear-rail {
      width:90px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:18px;
    }

    #inventory-1a .gear-rail-spacer { width:1px; height:14px; flex:0 0 14px; }
    #inventory-1a .gear-rail-large-spacer { width:1px; height:33px; flex:0 0 33px; }

    #inventory-1a .character-preview {
      width:167px;
      height:917px;
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      align-items:center;
      overflow:hidden;
    }

    #inventory-1a .character-preview img {
      width:167px;
      height:917px;
      object-fit:cover;
      object-position:center bottom;
    }

    #inventory-1a .gear-slot {
      width:75px;
      height:75px;
      padding:4px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      border:5px solid #d8d8d8;
      background-color:#5d5d5d;
      color:#ffffff;
    }

    #inventory-1a .gear-slot img { width:63px; height:63px; object-fit:contain; }
    #inventory-1a .gear-slot .gear-level { margin-top:-18px; align-self:flex-end; font-size:16px; }
    #inventory-1a .gear-slot.layout-placeholder { border-color:#d8d8d8; background-color:#5d5d5d; opacity:1; }

    #inventory-1a .region-divider {
      position:absolute;
      left:509px;
      top:68px;
      width:2px;
      height:949px;
      background-color:#8e8e8e;
    }

    #inventory-1a .vicinity-region {
      position:absolute;
      left:42px;
      top:37px;
      width:384px;
      height:952px;
      display:flex;
      flex-direction:column;
    }

    #inventory-1a .inventory-region {
      position:absolute;
      left:593px;
      top:37px;
      width:384px;
      height:952px;
      display:flex;
      flex-direction:column;
    }

    #inventory-1a .tile-panel {
      flex:1;
      padding:1px 10px 6px;
      display:flex;
      flex-direction:column;
      flex-wrap:nowrap;
      align-content:flex-start;
      gap:8px;
      overflow-x:hidden;
      overflow-y:auto;
      border-top:0;
      border-right:1px solid #d9d9d9;
      border-bottom:1px solid #d9d9d9;
      border-left:1px solid #d9d9d9;
      background-color:transparent;
      scrollbar-width:none;
    }

    #inventory-1a .tile-panel::-webkit-scrollbar { display:none; }

    #inventory-1a .list-header {
      width:384px;
      height:68px;
      flex:0 0 68px;
      padding:0 10px;
      display:flex;
      flex-direction:row;
      align-items:center;
      border-top:1px solid #d9d9d9;
      border-right:1px solid #d9d9d9;
      border-bottom:0;
      border-left:1px solid #d9d9d9;
      background-color:transparent;
    }

    #inventory-1a .vicinity-region .list-header {
      width:384px;
      height:0;
      flex:0 0 0;
      padding:0;
      overflow:hidden;
      border:0;
    }

    #inventory-1a .vicinity-region .tile-panel {
      padding-top:10px;
      border-top:1px solid #d9d9d9;
    }

    #inventory-1a .item-widget {
      width:364px;
      height:90px;
      flex:0 0 90px;
      display:flex;
      flex-direction:column;
    }

    #inventory-1a .item-tile {
      width:364px;
      height:90px;
      padding:3px;
      display:flex;
      flex-direction:row;
      align-items:center;
      gap:8px;
      border:3px solid transparent;
      background-color:transparent;
      color:#ffffff;
      cursor:pointer;
    }

    #inventory-1a .item-tile.empty { background-color:#323232; cursor:default; }
    #inventory-1a .item-icon {
      width:90px;
      height:84px;
      flex:0 0 90px;
      background-color:#5d5d5d;
      background-repeat:no-repeat;
      background-position:center;
      background-size:contain;
    }
    #inventory-1a .item-name {
      height:84px;
      flex:1;
      padding:8px;
      display:flex;
      align-items:center;
      overflow:hidden;
      background-color:#5d5d5d;
      font-size:20px;
      font-weight:700;
      line-height:24px;
      text-align:left;
    }
    #inventory-1a .item-count {
      width:30px;
      height:84px;
      flex:0 0 30px;
      display:flex;
      align-items:center;
      justify-content:center;
      background-color:#5d5d5d;
      font-size:24px;
      font-weight:700;
    }

    #inventory-1a .category-divider {
      width:364px;
      height:3px;
      flex:0 0 3px;
      background-color:#999999;
    }

    #inventory-1a .wide-item-widget {
      width:364px;
      height:90px;
      flex:0 0 90px;
      display:flex;
      flex-direction:column;
    }

    #inventory-1a .wide-item-widget .item-tile { width:364px; height:90px; }

    #inventory-1a .scroll-indicator {
      width:364px;
      height:30px;
      padding:3px;
      display:flex;
      flex-direction:row;
      justify-content:flex-start;
      border:2px solid #ffffff;
      background-color:#d9d9d9;
    }

    #inventory-1a .scroll-thumb { width:354px; height:20px; display:flex; justify-content:center; align-items:center; background-image:linear-gradient(to right,#696969 0 60%,transparent 60% 100%); }
    #inventory-1a .capacity-value { color:#ffffff; font-size:14px; font-weight:700; line-height:20px; white-space:nowrap; }

    #inventory-1a .vicinity-header-line {
      width:364px;
      height:3px;
      display:none;
      background-color:#999999;
    }

    #inventory-1a .tooltip-panel {
      position:absolute;
      left:360px;
      top:285px;
      width:225px;
      height:510px;
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:8px;
      border:4px solid #e6e6e6;
      background-color:rgba(205,205,205,0.98);
      color:#191919;
    }

    #inventory-1a .tooltip-panel[hidden] { display:none; }
    #inventory-1a.tooltips-hidden .tooltip-panel { display:none; }
    #inventory-1a.vicinity-tooltip-active .primary-tooltip { left:426px; }
    #inventory-1a.gear-tooltip-active .primary-tooltip { left:1309px; }
    #inventory-1a .tooltip-context { display:none; margin:0; font-size:14px; font-weight:700; color:#5a5a5a; }
    #inventory-1a .comparison-tooltip { top:60px; height:452px; }
    #inventory-1a.comparison-active .primary-tooltip { top:530px; height:452px; }
    #inventory-1a.comparison-active .tooltip-panel { gap:6px; }
    #inventory-1a.comparison-active .tooltip-context { display:block; }
    #inventory-1a.comparison-active .tooltip-image { height:100px; }
    #inventory-1a.comparison-active .tooltip-description { font-size:15px; line-height:19px; }
    #inventory-1a.comparison-active .tooltip-action { gap:3px; font-size:13px; }
    #inventory-1a.comparison-active .tooltip-action-key { width:22px; height:22px; }
    #inventory-1a .tooltip-panel.empty-slot { height:350px; }
    #inventory-1a.comparison-active .tooltip-panel.empty-slot { height:452px; }
    #inventory-1a .tooltip-panel.empty-slot .tooltip-image { opacity:0.58; }
    #inventory-1a .tooltip-panel.empty-slot .tooltip-description,
    #inventory-1a .tooltip-panel.empty-slot .tooltip-meta { display:none; }
    #inventory-1a .tooltip-title { margin:0; font-size:25px; font-weight:700; line-height:30px; }
    #inventory-1a .tooltip-type { margin:0; font-size:17px; color:#4d4d4d; }
    #inventory-1a .tooltip-image { width:185px; height:165px; align-self:center; object-fit:contain; }
    #inventory-1a .tooltip-description { margin:0; font-size:17px; line-height:23px; }
    #inventory-1a .tooltip-meta { display:flex; flex-direction:row; justify-content:space-between; font-size:16px; }
    #inventory-1a .tooltip-actions {
      margin-top:auto;
      padding-top:8px;
      display:flex;
      flex-direction:row;
      flex-wrap:wrap;
      gap:8px;
      border-top:2px solid #4c4c4c;
    }
    #inventory-1a .tooltip-actions:empty { display:none; }
    #inventory-1a .tooltip-action { display:flex; flex-direction:row; align-items:center; gap:5px; font-size:15px; font-weight:700; }
    #inventory-1a .tooltip-action-key { width:26px; height:26px; display:flex; justify-content:center; align-items:center; border:2px solid #191919; border-radius:50%; }
    #inventory-1a .tooltip-hold-label { padding:1px 4px; border:1px solid #191919; font-size:11px; }

    #inventory-1a .weapon-region {
      position:absolute;
      left:989px;
      top:90px;
      width:518px;
      height:899px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    #inventory-1a .weapon-row { width:518px; height:690px; display:flex; flex-direction:column; gap:12px; }

    #inventory-1a .weapon-widget {
      flex:none;
      width:518px;
      height:222px;
      display:flex;
      flex-direction:row;
      padding:6px;
      border:1px solid #d9d9d9;
      background-color:transparent;
    }

    #inventory-1a .weapon-card {
      flex:1;
      padding:0;
      display:flex;
      flex-direction:row;
      gap:8px;
      border:0;
      background-color:#474747;
    }

    #inventory-1a .weapon-card.held { background-color:#808080; }
    #inventory-1a .weapon-details { flex:1; height:208px; padding:3px 6px; display:flex; flex-direction:column; gap:2px; overflow:hidden; }
    #inventory-1a .weapon-heading { height:26px; flex:0 0 26px; display:flex; flex-direction:row; align-items:center; gap:6px; }
    #inventory-1a .weapon-name { margin:0; font-size:20px; font-weight:700; }
    #inventory-1a .weapon-class { padding:1px 4px; font-size:12px; font-weight:700; background-color:#080808; }
    #inventory-1a .held-label { margin-left:auto; font-size:11px; font-weight:700; }
    #inventory-1a .ammo-row { height:28px; flex:0 0 28px; display:flex; flex-direction:row; align-items:center; gap:3px; }
    #inventory-1a .ammo-loaded { font-size:20px; font-weight:700; }
    #inventory-1a .ammo-reserve { padding-top:4px; font-size:11px; color:#c8c8c8; }
    #inventory-1a .ammo-icon { width:28px; height:28px; object-fit:contain; }
    #inventory-1a .ammo-type { padding:1px 3px; font-size:12px; font-weight:700; background-color:#159431; }
    #inventory-1a .ammo-type.nine { background-color:#b12b2b; }

    #inventory-1a .weapon-body { flex:1; display:flex; flex-direction:row; gap:8px; overflow:hidden; }
    #inventory-1a .attachment-rail { width:138px; height:208px; flex:0 0 138px; display:flex; flex-direction:row; flex-wrap:wrap; align-content:flex-start; gap:2px; }
    #inventory-1a .attachment-slot {
      width:68px;
      height:68px;
      padding:3px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      border:2px solid #ffffff;
      background-color:#3c3c3c;
      color:#ffffff;
    }
    #inventory-1a .attachment-slot img { width:60px; height:60px; object-fit:contain; opacity:0.72; }
    #inventory-1a .attachment-slot.unavailable {
      border-color:#666666;
      background-color:#242424;
      opacity:0.55;
      cursor:default;
    }
    #inventory-1a .attachment-slot[data-slot-state="occupied"] img { opacity:1; }
    #inventory-1a .attachment-slot.quick-equip-target {
      border-color:#52e06f;
      outline:none;
      background-color:#315d3b;
      background-image:url('../assets/controller-x-letter.svg'),url('../assets/controller-x-vector.svg'),url('../assets/controller-x-fill.svg'),url('../assets/controller-x-shadow.svg');
      background-repeat:no-repeat,no-repeat,no-repeat,no-repeat;
      background-position:center,center,center,center;
      background-size:13px 17px,36px 36px,33px 33px,36px 36px;
    }
    #inventory-1a .attachment-slot.quick-equip-target img { visibility:hidden; }
    #inventory-1a .attachment-slot.confirm-equip-target {
      background-color:#315d3b;
      background-image:url('../assets/controller-a-letter.svg'),url('../assets/controller-x-vector.svg'),url('../assets/controller-x-fill.svg'),url('../assets/controller-x-shadow.svg');
      background-repeat:no-repeat,no-repeat,no-repeat,no-repeat;
      background-position:center,center,center,center;
      background-size:13px 17px,36px 36px,33px 33px,36px 36px;
    }
    #inventory-1a .attachment-slot.confirm-equip-target img { visibility:hidden; }

    #inventory-1a .weapon-visual {
      flex:1;
      min-height:0;
      background-repeat:no-repeat;
      background-position:center;
    }
    #inventory-1a .weapon-visual.m16 {
      background-image:url('../assets/weapon-m16.png');
      background-size:345px 210px;
    }
    #inventory-1a .weapon-visual.m249 {
      background-image:url('../assets/weapon-m249.png');
      background-size:345px 108px;
    }
    #inventory-1a .weapon-visual.p1911 {
      background-image:url('../assets/weapon-p1911.png');
      background-size:400px 165px;
      background-position:center;
    }

    #inventory-1a .secondary-weapons { width:518px; height:197px; padding:6px; display:flex; flex-direction:row; gap:6px; border:1px solid #d9d9d9; background-color:transparent; }
    #inventory-1a .secondary-slot { flex:1; padding:8px 12px; display:flex; flex-direction:column; border:0; background-color:#474747; color:#ffffff; font:inherit; text-align:left; }
    #inventory-1a .secondary-slot p { margin:0; font-size:22px; font-weight:700; }
    #inventory-1a .secondary-slot img { width:140px; height:112px; align-self:center; object-fit:contain; }

    #inventory-1a .top-status {
      position:absolute;
      left:1615px;
      top:18px;
      width:270px;
      height:42px;
      display:flex;
      flex-direction:row;
      justify-content:flex-end;
      gap:30px;
      font-size:26px;
      font-weight:700;
      color:#8c8c8c;
      display:none;
    }

    #inventory-1a .controller-guide {
      position:absolute;
      left:24px;
      top:1018px;
      width:1865px;
      height:44px;
      display:flex;
      flex-direction:row;
      align-items:center;
      gap:20px;
      padding:6px 10px;
      background-color:rgba(20,20,20,0.76);
      font-size:16px;
    }

    #inventory-1a .controller-key { padding:2px 7px; border:2px solid #ffffff; font-weight:700; }
    #inventory-1a .controller-action[hidden] { display:none; }
    #inventory-1a .tooltip-meta[hidden] { display:none; }
    #inventory-1a .interaction-message { color:#f7cf26; }
    #inventory-1a .gamepad-status { margin-left:auto; color:#a8a8a8; }

    #inventory-1a button:focus { outline:5px solid #f3d521; outline-offset:-5px; }
    #inventory-1a .tile-panel[tabindex="0"]:focus { outline:5px solid #f3d521; outline-offset:-5px; }
    #inventory-1a .compatible { border-color:#52e06f; background-color:#315d3b; }
    #inventory-1a .weapon-focused { border-color:#f3d521; }

    #inventory-1a .attachment-connectors {
      position:absolute;
      left:0;
      top:0;
      width:1920px;
      height:1080px;
      pointer-events:none;
    }
    #inventory-1a .socket-marker { fill:#acacac; stroke:#111111; stroke-width:1.5; }
    #inventory-1a .socket-marker.compatible { fill:#64ff81; stroke:#f4fff6; stroke-width:3; }
    #inventory-1a .socket-marker.focused { fill:#fff600; stroke:#fffde0; stroke-width:3; }
    #inventory-1a .weapon-card.weapon-dropped { opacity:0.38; }
  </style>
</head>
<body>
  <div id="preview-stage" data-preview-only="viewport-fitter">
  <main id="inventory-1a" class="tooltips-hidden" data-umg-name="Panel_Root" data-umg-type="Overlay">
    <section class="gear-region" data-umg-name="Box_GearAndOutfit">
      <h1 class="screen-title" data-umg-name="Txt_GearTitle">GEARS &amp; OUTFIT</h1>
      <div class="gear-layout">
        <div class="gear-rail equipment-rail">
          <div data-umg-widget="WBP_GearSlot"><button class="gear-slot" data-empty-slot="true" data-item-name="헬멧 슬롯" data-item-type="장비 슬롯" data-silhouette="../assets/slot-helmet.svg"></button></div>
          <div data-umg-widget="WBP_GearSlot"><button class="gear-slot" data-item-name="3레벨 배낭" data-item-type="장비" data-image="../assets/gear-backpack.png"><img src="../assets/gear-backpack.png" alt="3레벨 배낭"><span class="gear-level">Lv.3</span></button></div>
          <div data-umg-widget="WBP_GearSlot"><button class="gear-slot" data-item-name="3레벨 조끼" data-item-type="장비" data-image="../assets/gear-vest.png"><img src="../assets/gear-vest.png" alt="3레벨 조끼"><span class="gear-level">Lv.3</span></button></div>
        </div>
        <div class="character-preview" data-umg-name="Img_CharacterPreview">
          <img src="../assets/character.png" alt="Player character preview">
        </div>
        <div class="gear-rail outfit-rail">
          <div data-umg-widget="WBP_GearSlot"><button class="gear-slot" data-empty-slot="true" data-item-name="모자 슬롯" data-item-type="의상 슬롯" data-silhouette="../assets/slot-helmet.svg"></button></div>
          <div data-umg-widget="WBP_GearSlot"><button class="gear-slot" data-empty-slot="true" data-item-name="얼굴 슬롯" data-item-type="의상 슬롯" data-silhouette="../assets/slot-face.svg"></button></div>
          <div data-umg-widget="WBP_GearSlot"><button class="gear-slot" data-empty-slot="true" data-item-name="재킷 슬롯" data-item-type="의상 슬롯" data-silhouette="../assets/slot-jacket.svg"></button></div>
          <div class="gear-rail-spacer"></div>
          <div data-umg-widget="WBP_GearSlot"><button class="gear-slot" data-empty-slot="true" data-item-name="장갑 슬롯" data-item-type="의상 슬롯" data-silhouette="../assets/slot-gloves.svg"></button></div>
          <div data-umg-widget="WBP_GearSlot"><button class="gear-slot" data-empty-slot="true" data-item-name="바지 슬롯" data-item-type="의상 슬롯" data-silhouette="../assets/slot-pants.svg"></button></div>
          <div data-umg-widget="WBP_GearSlot"><button class="gear-slot" data-empty-slot="true" data-item-name="부츠 슬롯" data-item-type="의상 슬롯" data-silhouette="../assets/slot-boots.svg"></button></div>
          <div class="gear-rail-large-spacer"></div>
          <button class="gear-slot layout-placeholder" disabled aria-hidden="true"></button>
          <button class="gear-slot layout-placeholder" disabled aria-hidden="true"></button>
          <button class="gear-slot layout-placeholder" disabled aria-hidden="true"></button>
        </div>
      </div>
    </section>

    <div class="region-divider" aria-hidden="true"></div>

    <section class="vicinity-region" data-umg-name="Box_Vicinity">
      <h1 class="screen-title" data-umg-name="Txt_VicinityTitle">VICINITY</h1>
      <div class="list-header"><div class="vicinity-header-line" aria-hidden="true"></div></div>
      <div class="tile-panel" data-umg-name="Box_VicinityGrid" data-umg-type="ScrollBox">
        <div class="item-widget" data-umg-widget="WBP_InventoryItemTile"><button class="item-tile" autofocus data-default-focus="true" style="background-image:url('../assets/item-first-aid.png')" data-item-name="붕대" data-item-type="소모품" data-item-category="consumable" data-image="../assets/item-first-aid.png" data-description="사용 시 일정 시간에 걸쳐 체력을 회복합니다."></button></div>
        <div class="item-widget" data-umg-widget="WBP_InventoryItemTile"><button class="item-tile" style="background-image:url('../assets/item-med-kit.png')" data-item-name="의료용 키트" data-item-type="소모품" data-item-category="consumable" data-image="../assets/item-med-kit.png" data-description="사용 시 체력을 완전히 회복합니다."><span class="item-count">2</span></button></div>

      const selectedTooltip = root.querySelector('.comparison-tooltip');
      const selectedTitle = selectedTooltip.querySelector('.tooltip-title');
      const selectedType = selectedTooltip.querySelector('.tooltip-type');
      const selectedImage = selectedTooltip.querySelector('.tooltip-image');
      const selectedDescription = selectedTooltip.querySelector('.tooltip-description');
      const selectedCompatibility = selectedTooltip.querySelector('[data-selected-compatibility]');
      const title = tooltip.querySelector('.tooltip-title');
      const type = tooltip.querySelector('.tooltip-type');
      const image = tooltip.querySelector('.tooltip-image');
      const description = tooltip.querySelector('.tooltip-description');
      const compatibility = document.getElementById('tooltip-compatibility');
      const tooltipActions = root.querySelector('.tooltip-actions');
      const message = root.querySelector('.interaction-message');
      const gamepadStatus = root.querySelector('.gamepad-status');
      const controllerActions = Array.from(root.querySelectorAll('[data-controller-action]'));
      const connectorLines = document.getElementById('connector-lines');
      let pendingAttachment = null;
      let pendingSourceSlot = null;
      let returnFocus = null;
      let placementFocus = null;
      let lastSidearmAttachmentSlot = null;
      let previousButtons = [];
      let vicinityQuickEquipEnabled = true;
      let heldDirection = '';
      let nextDirectionRepeat = 0;
      let keyboardYStarted = 0;
      let gamepadYStarted = 0;
      let gamepadYHoldTriggered = false;
      root.dataset.vicinityQuickEquip = 'on';

      function fitPrototypeToViewport() {
        const designWidth = 1920;
        const designHeight = 1080;
        const availableWidth = previewStage.clientWidth;
        const availableHeight = previewStage.clientHeight;
        const scale = Math.min(availableWidth / designWidth, availableHeight / designHeight);
        const unscaledViewportWidth = availableWidth / scale;
        const unscaledViewportHeight = availableHeight / scale;
        root.style.zoom = String(scale);
        root.style.marginLeft = Math.max(0, (unscaledViewportWidth - designWidth) / 2) + 'px';
        root.style.marginTop = Math.max(0, (unscaledViewportHeight - designHeight) / 2) + 'px';
      }

      function currentFocusables() {
        return Array.from(root.querySelectorAll('button:not(:disabled), .tile-panel[tabindex="0"]'));
      }

      function itemContext(target) {
        if (target.closest('.vicinity-region')) return 'vicinity';
        if (target.closest('.inventory-region')) return 'inventory';
        if (target.closest('.attachment-slot')) return 'weapon-slot';
        if (target.closest('.secondary-weapons')) return 'secondary';
        if (target.closest('.gear-region')) return 'gear';
        return 'other';
      }

      function availableActions(target) {
        const context = itemContext(target);
        const itemCategory = target.dataset.itemCategory || '';
        const itemName = target.dataset.itemName || '';
        const slotState = target.dataset.slotState || '';
        if (!itemName || slotState === 'unavailable') return [];
        if (target.dataset.emptySlot === 'true') return [];

        if (pendingAttachment) {
          const isPlacementTarget = context === 'weapon-slot'
            && target !== pendingSourceSlot
            && compatibleSlots(pendingAttachment).includes(target);
          return isPlacementTarget ? [{ key:'A', label:'슬롯 선택' }] : [];
        }

        if (context === 'weapon-slot' && slotState === 'empty') {
          return [{ key:'Y', label:'무기 버리기', hold:true }];
        }

        if (context === 'weapon-slot' && slotState === 'occupied') {
          return [
            { key:'A', label:'슬롯 선택' },
            { key:'X', label:'분리' },
            { key:'Y', label:'부착물 버리기' },
            { key:'Y', label:'무기 버리기', hold:true }
          ];
        }

        if (target.dataset.compatibility) {
          if (context === 'vicinity') return [{ key:'X', label:'줍기' }, { key:'A', label:'슬롯 선택' }];
          const actions = [{ key:'X', label:'빠른 장착' }, { key:'A', label:'슬롯 선택' }];
          if (context === 'inventory') actions.push({ key:'Y', label:'버리기' });
          return actions;
        }
        if (context === 'vicinity' && itemCategory === 'weapon') {
          return [{ key:'X', label:'빠른 장착' }, { key:'A', label:'장착 슬롯 선택' }];
        }
        if (context === 'vicinity') return [{ key:'X', label:'줍기' }];
        if (context === 'inventory' && itemCategory === 'ammunition') return [{ key:'Y', label:'버리기' }];
        if (context === 'inventory' && itemCategory === 'consumable') return [{ key:'A', label:'사용' }, { key:'Y', label:'버리기' }];
        if (context === 'inventory' && itemCategory === 'throwable') return [{ key:'A', label:'장착' }, { key:'Y', label:'버리기' }];
        if (context === 'inventory') return [{ key:'A', label:'장착' }, { key:'Y', label:'버리기' }];
        if (context === 'gear') return [{ key:'A', label:'선택' }, { key:'Y', label:'버리기' }];
        return [];
      }

      function renderActionGuides(target) {
        const actions = availableActions(target);
        tooltipActions.replaceChildren();
        actions.forEach((action) => {
          const actionElement = document.createElement('span');
          actionElement.className = 'tooltip-action';
          const keyElement = document.createElement('span');
          keyElement.className = 'tooltip-action-key';
          keyElement.textContent = action.key;
          actionElement.appendChild(keyElement);
          if (action.hold) {
            const holdElement = document.createElement('span');
            holdElement.className = 'tooltip-hold-label';
            holdElement.textContent = '길게';
            actionElement.appendChild(holdElement);
          }
          actionElement.appendChild(document.createTextNode(' ' + action.label));
          tooltipActions.appendChild(actionElement);
        });

        controllerActions.forEach((element) => {
          const matches = actions.filter((candidate) => candidate.key.toLowerCase() === element.dataset.controllerAction);
          element.hidden = matches.length === 0;
          if (matches.length) {
            element.querySelector('[data-controller-label]').textContent = matches.map((action) => action.hold ? '길게: ' + action.label : action.label).join(' / ');
          }
        });
      }

      const socketMaps = {
        m16: {
          points:{ muzzle:[0.04,0.42], grip:[0.42,0.52], mag:[0.59,0.80], scope:[0.63,0.24], stock:[0.92,0.52] }
        },
        m249: {
          points:{ muzzle:[0.03,0.41], mag:[0.60,0.70], scope:[0.56,0.18], stock:[0.94,0.45] }
        },
        p1911: {
          points:{ muzzle:[0.28,0.30], mag:[0.64,0.74], scope:[0.58,0.18] }
        }
      };

      function socketPoint(weaponCard, socket, rootRect, scale) {
        const map = socketMaps[weaponCard?.dataset.weaponCard];
        const point = map?.points[socket];
        const visual = weaponCard?.querySelector('.weapon-visual');
        if (!point || !visual) return null;
        const visualRect = visual.getBoundingClientRect();
        return {
          x:(visualRect.left - rootRect.left) / scale + visualRect.width / scale * point[0],
          y:(visualRect.top - rootRect.top) / scale + visualRect.height / scale * point[1]
        };
      }

      function updateConnectorLines(slots, focusedSlot) {
        connectorLines.replaceChildren();
        const rootRect = root.getBoundingClientRect();
        const scale = rootRect.width / 1920;

        root.querySelectorAll('[data-weapon-card]').forEach((weaponCard) => {
          const map = socketMaps[weaponCard.dataset.weaponCard];
          if (!map) return;
          Object.keys(map.points).forEach((socket) => {
            const slot = weaponCard.querySelector('.attachment-slot[data-socket="' + socket + '"]');
            if (!slot || slot.dataset.slotState === 'unavailable') return;
            const point = socketPoint(weaponCard, socket, rootRect, scale);
            if (!point) return;
            const marker = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            marker.setAttribute('cx', point.x);
            marker.setAttribute('cy', point.y);
            marker.setAttribute('r', slot === focusedSlot ? '11' : slots.includes(slot) ? '10' : '6');
            marker.setAttribute('class', slot === focusedSlot
              ? 'socket-marker focused'
              : slots.includes(slot)
                ? 'socket-marker compatible'
                : 'socket-marker');
            connectorLines.appendChild(marker);
          });
        });

      }

      function compatibleSlots(payload) {
        if (!payload.socketType) return [];
        return Array.from(root.querySelectorAll('[data-socket="' + payload.socketType + '"]')).filter((slot) => {
          const weaponGroup = slot.closest('[data-weapon-group]')?.dataset.weaponGroup || '';
          return payload.weaponGroups.includes(weaponGroup) && slot.dataset.slotState !== 'unavailable';
        });
      }

      function updateSelectedAttachmentTooltip(target, slots) {
        const isComparing = Boolean(pendingAttachment && itemContext(target) === 'weapon-slot');
        root.classList.toggle('comparison-active', isComparing);
        selectedTooltip.hidden = !isComparing;
        if (!isComparing) return;

        selectedTitle.textContent = pendingAttachment.name;
        selectedType.textContent = pendingAttachment.type;
        selectedDescription.textContent = pendingAttachment.description || '선택한 부착물입니다.';
        selectedCompatibility.textContent = slots.length
          ? slots.map((slot) => slot.closest('[data-weapon-card]').dataset.weaponCard.toUpperCase()).join(', ')
          : '—';
        selectedCompatibility.parentElement.hidden = slots.length === 0;
        if (pendingAttachment.image) {
          selectedImage.src = pendingAttachment.image;
          selectedImage.alt = pendingAttachment.name;
          selectedImage.hidden = false;
        } else {
          selectedImage.hidden = true;
        }
      }

      function toggleTooltipVisibility() {
        root.classList.toggle('tooltips-hidden');
      }

      function toggleVicinityQuickEquip() {
        if (pendingAttachment) {
          message.textContent = '슬롯 선택 중에는 빠른 장착 설정을 변경할 수 없습니다';
          return;
        }
        vicinityQuickEquipEnabled = !vicinityQuickEquipEnabled;
        root.dataset.vicinityQuickEquip = vicinityQuickEquipEnabled ? 'on' : 'off';
        message.textContent = '주변 부착물 빈 슬롯 빠른 장착: ' + (vicinityQuickEquipEnabled ? '켜짐' : '꺼짐');
        if (document.activeElement instanceof HTMLElement && root.contains(document.activeElement)) updateFocusState(document.activeElement);
      }

      function updateFocusState(target) {
        root.querySelectorAll('.compatible').forEach((element) => element.classList.remove('compatible'));
        root.querySelectorAll('.quick-equip-target').forEach((element) => element.classList.remove('quick-equip-target'));
        root.querySelectorAll('.confirm-equip-target').forEach((element) => element.classList.remove('confirm-equip-target'));
        root.querySelectorAll('.weapon-focused').forEach((element) => element.classList.remove('weapon-focused'));
        const context = itemContext(target);
        root.classList.toggle('vicinity-tooltip-active', context === 'vicinity');
        root.classList.toggle('gear-tooltip-active', context === 'gear');

        if (target.matches('.tile-panel[tabindex="0"]')) {
          root.classList.remove('comparison-active');
          selectedTooltip.hidden = true;
          tooltip.hidden = true;
          renderActionGuides(target);
          updateConnectorLines([], null);
          return;
        }

        const itemType = target.dataset.itemType || '';
        const isEmptySocket = target.classList.contains('attachment-slot') && target.dataset.slotState === 'empty';
        const isEmptyGearSlot = target.closest('.gear-region') && target.dataset.emptySlot === 'true';
        const isEmptySlot = Boolean(isEmptySocket || isEmptyGearSlot);
        const itemName = target.dataset.itemName || '';
        const itemImage = target.dataset.image || target.querySelector('img')?.getAttribute('src') || '';
        const itemDescription = target.dataset.description || '';
        const isLooseAttachment = (context === 'vicinity' || context === 'inventory')
          && target.dataset.itemCategory === 'attachment'
          && Boolean(target.dataset.compatibility);
        const compatibilityPayload = pendingAttachment || (isLooseAttachment ? itemPayload(target) : null);
        const slots = compatibilityPayload ? compatibleSlots(compatibilityPayload) : [];
        updateSelectedAttachmentTooltip(target, slots);
        slots.forEach((slot) => slot.classList.add('compatible'));
        const heldSlot = slots.find((slot) => slot.closest('.weapon-card.held')) || null;
        const quickEquipTarget = !pendingAttachment && isLooseAttachment && heldSlot
          && (context === 'inventory' || (context === 'vicinity' && vicinityQuickEquipEnabled && heldSlot.dataset.slotState === 'empty'))
          ? heldSlot
          : null;
        if (quickEquipTarget) quickEquipTarget.classList.add('quick-equip-target');

        const weaponCard = target.closest('[data-weapon-card]');
        if (weaponCard) weaponCard.classList.add('weapon-focused');
        const focusedSlot = target.classList.contains('attachment-slot') ? target : null;
        if (pendingAttachment && focusedSlot && focusedSlot !== pendingSourceSlot && slots.includes(focusedSlot)) {
          focusedSlot.classList.add('confirm-equip-target');
        }
        const connectorSlots = slots.slice();
        if (focusedSlot && !connectorSlots.includes(focusedSlot)) connectorSlots.push(focusedSlot);
        updateConnectorLines(connectorSlots, focusedSlot);

        renderActionGuides(target);
        tooltip.classList.toggle('empty-slot', isEmptySlot);

        if (!itemName) {
          tooltip.hidden = true;
          return;
        }

        if (isEmptySlot) {
          const emptySocketTypes = {
            muzzle:'총구 부착물 장착 가능',
            grip:'손잡이 부착물 장착 가능',
            mag:'탄창 부착물 장착 가능',
            scope:'조준경 부착물 장착 가능',
            stock:'개머리판 부착물 장착 가능'
          };
          const silhouette = target.dataset.silhouette || target.querySelector('img')?.getAttribute('src') || '';
          title.textContent = itemName;
          type.textContent = isEmptySocket ? (emptySocketTypes[target.dataset.socket] || '부착물 장착 가능') : itemType;
          compatibility.parentElement.hidden = true;
          if (silhouette) {
            image.src = silhouette;
            image.alt = itemName + ' 실루엣';
            image.hidden = false;
          } else {
            image.hidden = true;
          }
          tooltip.hidden = false;
          return;
        }

        title.textContent = itemName;
        type.textContent = itemType;
        description.textContent = itemDescription || '장착된 아이템입니다. 선택하여 관리할 수 있습니다.';
        compatibility.textContent = slots.length
          ? slots.map((slot) => slot.closest('[data-weapon-card]').dataset.weaponCard.toUpperCase()).join(', ')
          : '—';
        compatibility.parentElement.hidden = slots.length === 0;
        if (itemImage) {
          image.src = itemImage;
          image.hidden = false;
        } else {
          image.hidden = true;
        }
        tooltip.hidden = false;
      }

      function nearestInDirection(current, direction, candidates) {
        const currentRect = current.getBoundingClientRect();
        const cx = currentRect.left + currentRect.width / 2;
        const cy = currentRect.top + currentRect.height / 2;
        let winner = null;
        let winnerScore = Number.POSITIVE_INFINITY;

        candidates.forEach((candidate) => {
          if (candidate === current) return;
          const rect = candidate.getBoundingClientRect();
          const x = rect.left + rect.width / 2;
          const y = rect.top + rect.height / 2;
          const dx = x - cx;
          const dy = y - cy;
          const valid = direction === 'left' ? dx < -8 : direction === 'right' ? dx > 8 : direction === 'up' ? dy < -8 : dy > 8;
          if (!valid) return;
          const primary = direction === 'left' || direction === 'right' ? Math.abs(dx) : Math.abs(dy);
          const secondary = direction === 'left' || direction === 'right' ? Math.abs(dy) : Math.abs(dx);
          const score = primary + secondary * 2.25;
          if (score < winnerScore) {
            winner = candidate;
            winnerScore = score;
          }
        });
        return winner;
      }

      function nearestGearSlot(current) {
        const gearSlots = Array.from(root.querySelectorAll('.equipment-rail button:not(:disabled)'));
        return nearestInDirection(current, 'right', gearSlots);
      }

      function attachmentGridCells(weaponCard) {
        return weaponCard ? Array.from(weaponCard.querySelectorAll('.attachment-slot')) : [];
      }

      function attachmentGridCell(weaponCard, row, column) {
        return attachmentGridCells(weaponCard)[row * 2 + column] || null;
      }

      function attachmentGridTarget(current, direction) {
        const weaponCard = current.closest('[data-weapon-card]');
        const cells = attachmentGridCells(weaponCard);
        const cellIndex = cells.indexOf(current);
        if (!weaponCard || cellIndex < 0) return null;

        const row = Math.floor(cellIndex / 2);
        const column = cellIndex % 2;

        if (direction === 'left' || direction === 'right') {
          const nextColumn = column + (direction === 'right' ? 1 : -1);
          if (nextColumn > 1) return nearestGearSlot(current);
          if (nextColumn < 0) return null;
          const candidate = attachmentGridCell(weaponCard, row, nextColumn);
          if (candidate && !candidate.disabled) return candidate;
          return direction === 'right' ? nearestGearSlot(current) : current;
        }

        const rowStep = direction === 'down' ? 1 : -1;
        for (let nextRow = row + rowStep; nextRow >= 0 && nextRow < 3; nextRow += rowStep) {
          const candidate = attachmentGridCell(weaponCard, nextRow, column);
          if (candidate && !candidate.disabled) return candidate;
        }

        const weaponCards = Array.from(root.querySelectorAll('[data-weapon-card]'));
        const cardIndex = weaponCards.indexOf(weaponCard);
        for (let nextCardIndex = cardIndex + rowStep; nextCardIndex >= 0 && nextCardIndex < weaponCards.length; nextCardIndex += rowStep) {
          const rowOrder = direction === 'down' ? [0, 1, 2] : [2, 1, 0];
          for (const nextRow of rowOrder) {
            const candidate = attachmentGridCell(weaponCards[nextCardIndex], nextRow, column);
            if (candidate && !candidate.disabled) return candidate;
          }
        }

        if (direction === 'down' && weaponCard.dataset.weaponCard === 'p1911') {
          return root.querySelector('[data-secondary-slot="throwable"]');
        }
        if (direction === 'down') {
          return root.querySelector('[data-secondary-slot="' + (column === 0 ? 'throwable' : 'melee') + '"]');
        }
        return current;
      }

      function latestSidearmAttachment() {
        if (lastSidearmAttachmentSlot?.isConnected && !lastSidearmAttachmentSlot.disabled) {
          return lastSidearmAttachmentSlot;
        }
        const sidearmCard = root.querySelector('[data-weapon-card="p1911"]');
        return sidearmCard
          ? Array.from(sidearmCard.querySelectorAll('.attachment-slot:not(:disabled)')).at(-1) || null
          : null;
      }

      function verticalColumnCandidates(current) {
        const gearRail = current.closest('.gear-rail');
        if (gearRail) return Array.from(gearRail.querySelectorAll('button:not(:disabled)'));

        const listPanel = current.closest('.vicinity-region .tile-panel, .inventory-region .tile-panel');
        if (!listPanel) return null;
        const currentRect = current.getBoundingClientRect();
        return Array.from(listPanel.querySelectorAll('button:not(:disabled)')).filter((candidate) => {
          if (candidate === current) return true;
          const rect = candidate.getBoundingClientRect();
          const overlap = Math.min(currentRect.right, rect.right) - Math.max(currentRect.left, rect.left);
          return overlap >= Math.min(currentRect.width, rect.width) * 0.25;
        });
      }

      function moveFocus(direction) {
        const focusables = currentFocusables();
        const current = document.activeElement instanceof HTMLElement && root.contains(document.activeElement)
          ? document.activeElement
          : focusables[0];
        if (!current) return;

        if (pendingAttachment) {
          const placementSlots = compatibleSlots(pendingAttachment).filter((slot) => slot !== pendingSourceSlot);
          const nextPlacementSlot = nearestInDirection(current, direction, placementSlots);
          if (nextPlacementSlot) nextPlacementSlot.focus();
          return;
        }

        if (current.classList.contains('attachment-slot')) {
          const nextGridSlot = attachmentGridTarget(current, direction);
          if (nextGridSlot) {
            nextGridSlot.focus();
            return;
          }
        }

        const secondaryType = current.dataset.secondarySlot || '';
        if (secondaryType) {
          const throwable = root.querySelector('[data-secondary-slot="throwable"]');
          const melee = root.querySelector('[data-secondary-slot="melee"]');
          if (secondaryType === 'throwable' && direction === 'left') {
            const inventoryItems = Array.from(root.querySelectorAll('.inventory-region button:not(:disabled)'));
            inventoryItems.at(-1)?.focus();
            return;
          }
          if (secondaryType === 'throwable' && direction === 'right') {
            melee?.focus();
            return;
          }
          if (secondaryType === 'melee' && direction === 'left') {
            throwable?.focus();
            return;
          }
          if (secondaryType === 'melee' && direction === 'right') {
            nearestGearSlot(current)?.focus();
            return;
          }
          if (direction === 'up') {
            latestSidearmAttachment()?.focus();
          }
          return;
        }

        if (direction === 'up' || direction === 'down') {
          const columnCandidates = verticalColumnCandidates(current);
          if (columnCandidates) {
            const nextInColumn = nearestInDirection(current, direction, columnCandidates);
            if (nextInColumn) nextInColumn.focus();
            return;
          }
        }

        let candidates = itemContext(current) === 'inventory'
          ? focusables.filter((candidate) => !candidate.dataset.secondarySlot)
          : focusables;
        if (!current.closest('.gear-region')) {
          candidates = candidates.filter((candidate) => !candidate.closest('.outfit-rail'));
        }
        const next = nearestInDirection(current, direction, candidates);
        if (next) next.focus();
      }

      function itemPayload(source) {
        return {
          name: source.dataset.itemName || '부착물',
          type: source.dataset.itemType || '부착물',
          category: source.dataset.itemCategory || 'attachment',
          description: source.dataset.description || '',
          socketType: source.dataset.compatibility || source.dataset.socket || '',
          weaponGroups: (source.dataset.compatibleWeaponGroups || source.closest('[data-weapon-group]')?.dataset.weaponGroup || '').split(',').map((group) => group.trim()).filter(Boolean),
          image: source.dataset.image || source.querySelector('img')?.getAttribute('src') || '',
          count: Number.parseInt(source.querySelector('.item-count')?.textContent || '1', 10) || 1
        };
      }

      function itemQuantity(source) {
        return Number.parseInt(source.querySelector('.item-count')?.textContent || '1', 10) || 1;
      }

      function renderLinearListItem(source, quantity = itemQuantity(source)) {
        const icon = document.createElement('span');
        icon.className = 'item-icon';
        if (source.dataset.image) icon.style.backgroundImage = "url('" + source.dataset.image + "')";

        const name = document.createElement('span');
        name.className = 'item-name';
        name.textContent = source.dataset.itemName || '아이템';

        const count = document.createElement('span');
        count.className = 'item-count';
        count.textContent = String(Math.max(1, Math.floor(quantity)));

        source.style.removeProperty('background-image');
        source.replaceChildren(icon, name, count);
      }

      function setItemQuantity(source, quantity) {
        const normalized = Math.max(1, Math.floor(quantity));
        let count = source.querySelector('.item-count');
        if (!count) {
          count = document.createElement('span');
          count.className = 'item-count';
          source.appendChild(count);
        }
        count.textContent = String(normalized);
      }

      function focusAndRefresh(target) {
        if (!(target instanceof HTMLElement) || !target.isConnected || target.disabled) return;
        target.focus();
        requestAnimationFrame(() => {
          if (target.isConnected && document.activeElement === target) updateFocusState(target);
        });
      }

      function equipIntoSlot(slot, payload) {
        const replacedAttachment = slot.dataset.slotState === 'occupied' ? itemPayload(slot) : null;
        if (replacedAttachment) restoreAttachmentToInventory(replacedAttachment);
        slot.dataset.itemName = payload.name;
        slot.dataset.itemType = payload.type;
        slot.dataset.itemCategory = payload.category;
        slot.dataset.description = payload.description;
        slot.dataset.image = payload.image;
        slot.dataset.compatibility = payload.socketType;
        slot.dataset.compatibleWeaponGroups = payload.weaponGroups.join(',');
        slot.dataset.slotState = 'occupied';
        slot.disabled = false;
        slot.classList.remove('unavailable');
        slot.replaceChildren();
        if (payload.image) {
          const equippedImage = document.createElement('img');
          equippedImage.src = payload.image;
          equippedImage.alt = payload.name;
          slot.appendChild(equippedImage);
        }
        return replacedAttachment;
      }

      function emptyAttachmentSlot(slot) {
        const silhouette = slot.dataset.silhouette || '';
        const socketNames = { muzzle:'총구 슬롯', grip:'손잡이 슬롯', mag:'탄창 슬롯', scope:'조준경 슬롯', stock:'개머리판 슬롯' };
        slot.dataset.itemName = socketNames[slot.dataset.socket] || '부착물 슬롯';
        slot.dataset.itemType = '빈 슬롯';
        slot.dataset.slotState = 'empty';
        delete slot.dataset.itemCategory;
        delete slot.dataset.description;
        delete slot.dataset.image;
        delete slot.dataset.compatibility;
        delete slot.dataset.compatibleWeaponGroups;
        slot.replaceChildren();
        if (silhouette) {
          const silhouetteImage = document.createElement('img');
          silhouetteImage.src = silhouette;
          silhouetteImage.alt = slot.dataset.itemName + ' 실루엣';
          slot.appendChild(silhouetteImage);
        }
      }

      function categoryEndReference(panel, category) {
        const categoryBreaks = {
          consumable:'consumables-throwables',
          throwable:'throwables-ammo',
          ammunition:'ammo-attachments',
          attachment:'attachments-weapons'
        };
        const breakName = categoryBreaks[category];
        return breakName ? panel.querySelector('[data-category-break="' + breakName + '"]') : null;
      }

      function categoryWrappers(panel, category) {
        return Array.from(panel.children).filter((child) => {
          const button = child.querySelector('button.item-tile');
          return button && (button.dataset.itemCategory === category || button.dataset.emptyCategory === category);
        });
      }

      function updateCategoryDividers(panel) {
        if (!panel) return;
        const categories = ['consumable', 'throwable', 'ammunition', 'attachment', 'weapon'];
        const dividerBeforeCategory = {
          throwable:'consumables-throwables',
          ammunition:'throwables-ammo',
          attachment:'ammo-attachments',
          weapon:'attachments-weapons'
        };
        panel.querySelectorAll('.category-divider').forEach((divider) => { divider.hidden = true; });
        const populatedCategories = categories.filter((category) => categoryWrappers(panel, category).length > 0);
        populatedCategories.slice(1).forEach((category) => {
          const dividerName = dividerBeforeCategory[category];
          const divider = dividerName ? panel.querySelector('[data-category-break="' + dividerName + '"]') : null;
          if (divider) divider.hidden = false;
        });
      }

      function updateEmptyListFocus(panel) {
        if (!panel) return false;
        const isEmpty = panel.querySelector('button.item-tile:not(:disabled)') === null;
        if (isEmpty) {
          panel.tabIndex = 0;
          panel.setAttribute('aria-label', panel.closest('.vicinity-region') ? '빈 주변 목록' : '빈 인벤토리 목록');
        } else {
          panel.removeAttribute('tabindex');
          panel.removeAttribute('aria-label');
        }
        return isEmpty;
      }

      function compactCategory(panel, category) {
        const reference = categoryEndReference(panel, category);
        categoryWrappers(panel, category).forEach((wrapper) => panel.insertBefore(wrapper, reference));
      }

      function clearListItem(source) {
        const emptiedCategory = source.dataset.itemCategory || 'attachment';
        const panel = source.closest('.tile-panel');
        const categoryItems = panel
          ? categoryWrappers(panel, emptiedCategory).map((wrapper) => wrapper.querySelector('button.item-tile')).filter((button) => button && !button.disabled)
          : [];
        const sourceIndex = categoryItems.indexOf(source);
        const panelItems = panel ? Array.from(panel.querySelectorAll('button:not(:disabled)')) : [];
        const fallback = categoryItems[sourceIndex + 1] || categoryItems[sourceIndex - 1]
          || panelItems[panelItems.indexOf(source) + 1] || panelItems[panelItems.indexOf(source) - 1] || null;
        source.closest('.item-widget, .wide-item-widget')?.remove();
        updateCategoryDividers(panel);
        const isEmpty = updateEmptyListFocus(panel);
        return fallback || (isEmpty ? panel : null);
      }

      function createListDestination(regionSelector, category) {
        const panel = root.querySelector(regionSelector + ' .tile-panel');
        if (!panel) return null;
        const wrapper = document.createElement('div');
        wrapper.className = category === 'weapon' ? 'wide-item-widget' : 'item-widget';
        wrapper.dataset.umgWidget = 'WBP_InventoryItemTile';
        const button = document.createElement('button');
        button.className = 'item-tile';
        wrapper.appendChild(button);
        panel.insertBefore(wrapper, categoryEndReference(panel, category));
        return button;
      }

      function populateListItem(destination, payload) {
        destination.className = 'item-tile';
        destination.dataset.itemName = payload.name;
        destination.dataset.itemType = payload.type;
        destination.dataset.itemCategory = payload.category;
        destination.dataset.image = payload.image;
        destination.dataset.description = payload.description;
        if (payload.socketType) destination.dataset.compatibility = payload.socketType;
        else delete destination.dataset.compatibility;
        if (payload.weaponGroups?.length) destination.dataset.compatibleWeaponGroups = payload.weaponGroups.join(',');
        else delete destination.dataset.compatibleWeaponGroups;
        renderLinearListItem(destination, payload.count || 1);
      }

      function restoreItemToList(regionSelector, payload) {
        const panel = root.querySelector(regionSelector + ' .tile-panel');
        if (!panel) return false;
        const stackable = ['consumable', 'throwable', 'ammunition'].includes(payload.category);
        const stackLimit = payload.category === 'ammunition' ? 30 : Number.POSITIVE_INFINITY;
        let remaining = Math.max(1, Number(payload.count) || 1);

        if (stackable) {
          const matchingStacks = categoryWrappers(panel, payload.category)
            .map((wrapper) => wrapper.querySelector('button.item-tile'))
            .filter((button) => button && button.dataset.itemName === payload.name);
          matchingStacks.forEach((button) => {
            if (remaining <= 0) return;
            const current = itemQuantity(button);
            const transferred = Math.min(remaining, stackLimit - current);
            if (transferred > 0) {
              setItemQuantity(button, current + transferred);
              remaining -= transferred;
            }
          });
        }

        while (remaining > 0) {
          const destination = createListDestination(regionSelector, payload.category);
          if (!destination) return false;
          const destinationQuantity = stackable ? Math.min(remaining, stackLimit) : 1;
          populateListItem(destination, { ...payload, count:destinationQuantity });
          remaining -= destinationQuantity;
          if (!stackable) remaining = 0;
        }

        compactCategory(panel, payload.category);
        updateCategoryDividers(panel);
        updateEmptyListFocus(panel);
        return true;
      }

      function consumeListUnit(source) {
        const quantity = itemQuantity(source);
        if (quantity > 1) {
          setItemQuantity(source, quantity - 1);
          updateFocusState(source);
          return source;
        }
        return clearListItem(source);
      }

      function restoreAttachmentToInventory(payload) {
        return restoreItemToList('.inventory-region', payload);
      }

      function restoreAttachmentToVicinity(payload) {
        return restoreItemToList('.vicinity-region', payload);
      }

      function equipThrowable(payload) {
        const slot = root.querySelector('[data-secondary-slot="throwable"]');
        if (!slot) return null;
        const replacedThrowable = slot.dataset.itemName ? itemPayload(slot) : null;
        if (replacedThrowable) restoreItemToList('.inventory-region', replacedThrowable);
        slot.dataset.itemName = payload.name;
        slot.dataset.itemType = payload.type;
        slot.dataset.itemCategory = payload.category;
        slot.dataset.image = payload.image;
        slot.dataset.description = '현재 장착된 투척 무기입니다.';
        slot.replaceChildren();
        const title = document.createElement('p');
        title.append(payload.name + '   ');
        const weaponClass = document.createElement('span');
        weaponClass.className = 'weapon-class';
        weaponClass.textContent = '투척 무기';
        title.appendChild(weaponClass);
        slot.appendChild(title);
        if (payload.image) {
          const image = document.createElement('img');
          image.src = payload.image;
          image.alt = payload.name;
          slot.appendChild(image);
        }
        return slot;
      }

      function quickEquip() {
        const source = document.activeElement;
        if (!(source instanceof HTMLButtonElement) || !source.dataset.compatibility) {
          message.textContent = '빠른 장착이 가능한 부착물을 선택하세요';
          return;
        }
        const payload = itemPayload(source);
        const destination = compatibleSlots(payload).find((slot) => slot.closest('.weapon-card.held'));
        if (itemContext(source) === 'vicinity' && (!vicinityQuickEquipEnabled || !destination || destination.dataset.slotState !== 'empty')) {
          restoreItemToList('.inventory-region', payload);
          const fallback = clearListItem(source);
          message.textContent = payload.name + ' 줍기';
          focusAndRefresh(fallback);
          return;
        }
        if (!destination) {
          message.textContent = '현재 장착 중인 무기에 호환 슬롯이 없습니다';
          return;
        }
        const replacedAttachment = equipIntoSlot(destination, payload);
        message.textContent = replacedAttachment
          ? payload.name + '을(를) 현재 무기에 장착하고 ' + replacedAttachment.name + '을(를) 인벤토리로 이동했습니다'
          : payload.name + '을(를) 현재 무기에 빠르게 장착했습니다';
        const fallback = clearListItem(source);
        focusAndRefresh(fallback || destination);
      }

      function selectOrConfirmSlot() {
        const current = document.activeElement;
        if (!(current instanceof HTMLButtonElement)) return;

        if (pendingAttachment) {
          if (compatibleSlots(pendingAttachment).includes(current)) {
            if (pendingSourceSlot === current) {
              message.textContent = '교체할 다른 호환 슬롯을 선택하세요';
              return;
            }
            const replacedAttachment = equipIntoSlot(current, pendingAttachment);
            if (pendingSourceSlot) emptyAttachmentSlot(pendingSourceSlot);
            if (!pendingSourceSlot && returnFocus?.closest('.tile-panel')) clearListItem(returnFocus);
            message.textContent = replacedAttachment
              ? pendingAttachment.name + '을(를) 장착하고 ' + replacedAttachment.name + '을(를) 인벤토리로 이동했습니다'
              : pendingAttachment.name + '을(를) 선택한 슬롯에 장착했습니다';
            pendingAttachment = null;
            pendingSourceSlot = null;
            returnFocus = null;
            placementFocus = null;
            updateFocusState(current);
          } else {
            message.textContent = '강조 표시된 호환 슬롯을 선택하세요';
          }
          return;
        }

        if (itemContext(current) === 'weapon-slot' && current.dataset.slotState === 'occupied') {
          pendingAttachment = itemPayload(current);
          pendingSourceSlot = current;
          returnFocus = current;
          const destination = compatibleSlots(pendingAttachment).find((slot) => slot !== current);
          if (!destination) {
            message.textContent = '교체할 수 있는 다른 호환 슬롯이 없습니다';
            pendingAttachment = null;
            pendingSourceSlot = null;
            returnFocus = null;
            placementFocus = null;
            return;
          }
          message.textContent = '교체할 호환 부착물 슬롯을 선택하세요';
          placementFocus = destination;
          destination.focus();
          return;
        }

        if (current.dataset.compatibility) {
          pendingAttachment = itemPayload(current);
          pendingSourceSlot = null;
          returnFocus = current;
          const destinations = compatibleSlots(pendingAttachment);
          const heldDestination = destinations.find((slot) => slot.closest('.weapon-card.held'));
          const anyDestination = destinations[0];
          if (!anyDestination) {
            message.textContent = '호환되는 무기 슬롯이 없습니다';
            pendingAttachment = null;
            returnFocus = null;
            placementFocus = null;
            return;
          }
          message.textContent = '강조 표시된 부착물 슬롯을 선택하세요';
          placementFocus = heldDestination || anyDestination;
          placementFocus.focus();
          return;
        }

        const context = itemContext(current);
        if (current.dataset.itemCategory === 'ammunition') {
          message.textContent = '탄약은 줍거나 버리기만 할 수 있습니다';
          return;
        }
        if (context === 'inventory' && current.dataset.itemCategory === 'consumable') {
          const usedName = current.dataset.itemName;
          const fallback = consumeListUnit(current);
          message.textContent = usedName + ' 사용';
          focusAndRefresh(fallback);
          return;
        }
        if (context === 'inventory' && current.dataset.itemCategory === 'throwable') {
          const payload = itemPayload(current);
          const throwableSlot = equipThrowable(payload);
          const fallback = consumeListUnit(current);
          message.textContent = payload.name + ' 장착';
          focusAndRefresh(fallback || throwableSlot);
          return;
        }
        if (context === 'vicinity') {
          if (current.dataset.itemCategory === 'weapon') {
            message.textContent = '무기 장착 기능은 아직 구현되지 않았습니다';
            return;
          }
          message.textContent = current.dataset.itemName + '에는 A 동작이 없습니다';
          return;
        }

        message.textContent = current.dataset.itemName ? current.dataset.itemName + ' 선택' : '슬롯 선택';
      }

      function handleXAction() {
        const current = document.activeElement;
        if (!(current instanceof HTMLButtonElement)) return;
        if (itemContext(current) === 'vicinity' && current.dataset.itemCategory === 'weapon') {
          message.textContent = '무기 장착 기능은 아직 구현되지 않았습니다';
          return;
        }
        if (itemContext(current) === 'weapon-slot' && current.dataset.slotState === 'occupied') {
          const payload = itemPayload(current);
          if (restoreAttachmentToInventory(payload)) {
            emptyAttachmentSlot(current);
            message.textContent = payload.name + '을(를) 분리하여 인벤토리로 이동했습니다';
            updateFocusState(current);
          } else {
            restoreAttachmentToVicinity(payload);
            emptyAttachmentSlot(current);
            message.textContent = '인벤토리 공간이 부족하여 부착물을 바닥에 버렸습니다';
            updateFocusState(current);
          }
          return;
        }
        if (current.dataset.compatibility) {
          quickEquip();
          return;
        }
        const context = itemContext(current);
        if (context === 'vicinity') {
          const payload = itemPayload(current);
          const pickedName = payload.name;
          if (payload.category !== 'weapon') restoreItemToList('.inventory-region', payload);
          const fallback = clearListItem(current);
          message.textContent = payload.category === 'weapon' ? pickedName + '을(를) 무기 슬롯에 장착' : pickedName + ' 줍기';
          focusAndRefresh(fallback);
          return;
        }
        message.textContent = '이 아이템에는 X 동작이 없습니다';
      }

      function handleYAction(isHold) {
        if (pendingAttachment) {
          message.textContent = '슬롯 선택을 취소하려면 B를 누르세요';
          return;
        }
        const current = document.activeElement;
        if (!(current instanceof HTMLButtonElement)) return;
        const context = itemContext(current);
        if (context === 'weapon-slot' && (current.dataset.slotState === 'occupied' || current.dataset.slotState === 'empty')) {
          const weaponCard = current.closest('[data-weapon-card]');
          if (isHold) {
            weaponCard.classList.add('weapon-dropped');
            message.textContent = weaponCard.dataset.weaponCard.toUpperCase() + '과(와) 모든 부착물을 버렸습니다';
          } else if (current.dataset.slotState === 'occupied') {
            const payload = itemPayload(current);
            const droppedName = payload.name;
            restoreAttachmentToVicinity(payload);
            emptyAttachmentSlot(current);
            message.textContent = droppedName + '을(를) 주변에 버렸습니다';
            updateFocusState(current);
          }
          return;
        }
        if (context === 'inventory') {
          const payload = itemPayload(current);
          const droppedName = payload.name;
          restoreItemToList('.vicinity-region', payload);
          const fallback = clearListItem(current);
          message.textContent = droppedName + '을(를) 주변에 버렸습니다';
          focusAndRefresh(fallback);
          return;
        }
        if (context === 'gear') {
          message.textContent = current.dataset.itemName + ' 버리기';
          return;
        }
        message.textContent = '이 위치에서는 버릴 수 없습니다';
      }

      function cancelOrBack() {
        if (pendingAttachment) {
          const cancelledName = pendingAttachment.name;
          pendingAttachment = null;
          pendingSourceSlot = null;
          placementFocus = null;
          message.textContent = cancelledName + ' 슬롯 선택 취소';
          if (returnFocus) returnFocus.focus();
          returnFocus = null;
          return;
        }
        message.textContent = '뒤로 / 인벤토리 닫기';
      }

      function handleAction(action) {
        if (pendingAttachment && action !== 'select' && action !== 'back') {
          message.textContent = '슬롯을 선택하거나 B를 눌러 취소하세요';
          return;
        }
        if (action === 'select') selectOrConfirmSlot();
        if (action === 'back') cancelOrBack();
        if (action === 'quick') handleXAction();
        requestAnimationFrame(() => {
          const focused = document.activeElement;
          if (focused instanceof HTMLElement && focused.isConnected && !focused.disabled) updateFocusState(focused);
        });
      }

      root.addEventListener('focusin', (event) => {
        if (event.target instanceof HTMLElement && (event.target instanceof HTMLButtonElement || event.target.matches('.tile-panel[tabindex="0"]'))) {
          if (pendingAttachment) {
            const placementSlots = compatibleSlots(pendingAttachment).filter((slot) => slot !== pendingSourceSlot);
            if (!placementSlots.includes(event.target)) {
              placementFocus?.focus();
              return;
            }
            placementFocus = event.target;
          }
          if (event.target.classList.contains('attachment-slot') && event.target.closest('[data-weapon-card="p1911"]')) {
            lastSidearmAttachmentSlot = event.target;
          }
          updateFocusState(event.target);
        }
      });

      root.addEventListener('keydown', (event) => {
        const directions = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down' };
        if (directions[event.key]) {
          event.preventDefault();
          moveFocus(directions[event.key]);
        }
        if (event.key.toLowerCase() === 'x') handleAction('quick');
        if (event.key === 'Enter' || event.key.toLowerCase() === 'a') handleAction('select');
        if (event.key === 'Escape' || event.key.toLowerCase() === 'b') handleAction('back');
        if (event.key === 'ContextMenu' && !event.repeat) {
          event.preventDefault();
          toggleVicinityQuickEquip();
        }
        if (event.key.toLowerCase() === 'v' && !event.repeat) {
          event.preventDefault();
          toggleTooltipVisibility();
        }
        if (event.key.toLowerCase() === 'y' && !event.repeat) {
          event.preventDefault();
          keyboardYStarted = performance.now();
        }
      });

      root.addEventListener('keyup', (event) => {
        if (event.key.toLowerCase() !== 'y' || !keyboardYStarted) return;
        event.preventDefault();
        handleYAction(performance.now() - keyboardYStarted >= 650);
        keyboardYStarted = 0;
      });

      function primaryGamepad() {
        if (!navigator.getGamepads) return null;
        return Array.from(navigator.getGamepads()).find((gamepad) => gamepad?.connected) || null;
      }

      function pressed(gamepad, buttonIndex) {
        return Boolean(gamepad.buttons[buttonIndex]?.pressed);
      }

      function gamepadDirection(gamepad) {
        if (pressed(gamepad, 12) || (gamepad.axes[3] || 0) < -0.65) return 'up';
        if (pressed(gamepad, 13) || (gamepad.axes[3] || 0) > 0.65) return 'down';
        if (pressed(gamepad, 14) || (gamepad.axes[2] || 0) < -0.65) return 'left';
        if (pressed(gamepad, 15) || (gamepad.axes[2] || 0) > 0.65) return 'right';
        return '';
      }

      function pollGamepad(now) {
        const gamepad = primaryGamepad();
        if (!gamepad) {
          gamepadStatus.textContent = '컨트롤러 버튼을 눌러 연결';
          previousButtons = [];
          heldDirection = '';
          gamepadYStarted = 0;
          gamepadYHoldTriggered = false;
          requestAnimationFrame(pollGamepad);
          return;
        }

        gamepadStatus.textContent = '게임패드 연결됨';
        const direction = gamepadDirection(gamepad);
        if (direction) {
          if (direction !== heldDirection) {
            moveFocus(direction);
            heldDirection = direction;
            nextDirectionRepeat = now + 320;
          } else if (now >= nextDirectionRepeat) {
            moveFocus(direction);
            nextDirectionRepeat = now + 135;
          }
        } else {
          heldDirection = '';
        }

        const actions = [
          { index:0, name:'select' },
          { index:1, name:'back' },
          { index:2, name:'quick' }
        ];
        actions.forEach((action) => {
          const isPressed = pressed(gamepad, action.index);
          if (isPressed && !previousButtons[action.index]) handleAction(action.name);
          previousButtons[action.index] = isPressed;
        });

        const viewPressed = pressed(gamepad, 8);
        if (viewPressed && !previousButtons[8]) toggleTooltipVisibility();
        previousButtons[8] = viewPressed;

        const menuPressed = pressed(gamepad, 9);
        if (menuPressed && !previousButtons[9]) toggleVicinityQuickEquip();
        previousButtons[9] = menuPressed;

        const yPressed = pressed(gamepad, 3);
        const yWasPressed = Boolean(previousButtons[3]);
        if (yPressed && !yWasPressed) {
          gamepadYStarted = now;
          gamepadYHoldTriggered = false;
        }
        if (yPressed && !gamepadYHoldTriggered && now - gamepadYStarted >= 650) {
          const current = document.activeElement;
          if (current instanceof HTMLButtonElement && itemContext(current) === 'weapon-slot' && (current.dataset.slotState === 'occupied' || current.dataset.slotState === 'empty')) {
            handleYAction(true);
            gamepadYHoldTriggered = true;
          }
        }
        if (!yPressed && yWasPressed && !gamepadYHoldTriggered) handleYAction(false);
        previousButtons[3] = yPressed;

        requestAnimationFrame(pollGamepad);
      }

      window.addEventListener('gamepadconnected', () => { gamepadStatus.textContent = '게임패드 연결됨'; });
      window.addEventListener('gamepaddisconnected', () => { gamepadStatus.textContent = '게임패드 연결 해제됨'; });
      window.addEventListener('resize', () => {
        fitPrototypeToViewport();
        if (document.activeElement instanceof HTMLElement && root.contains(document.activeElement)) requestAnimationFrame(() => updateFocusState(document.activeElement));
      });

      root.querySelectorAll('.tile-panel .item-tile').forEach((item) => renderLinearListItem(item));
      const firstItem = root.querySelector('.vicinity-region button:not(:disabled)');
      fitPrototypeToViewport();
      root.querySelectorAll('.tile-panel').forEach((panel) => {
        updateCategoryDividers(panel);
        updateEmptyListFocus(panel);
      });
      if (firstItem) firstItem.focus({ preventScroll:true });
      requestAnimationFrame(() => {
        if (firstItem && document.activeElement === document.body) firstItem.focus({ preventScroll:true });
      });
      requestAnimationFrame(pollGamepad);
    }());
  </script>
</body>
</html>
