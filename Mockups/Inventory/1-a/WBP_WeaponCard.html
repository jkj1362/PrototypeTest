<div data-umg-name="Border_WeaponCard" style="display:flex; flex-direction:column; width:518px; height:222px; padding:6px; border:1px solid #D9D9D9; background-color:transparent">
  <div data-umg-name="Panel_WeaponCard" style="display:flex; flex-direction:row; flex:1; gap:8px; background-color:#474747">
    <div data-umg-name="Box_AttachmentSockets" style="display:flex; flex-direction:row; flex-wrap:wrap; gap:2px; width:138px; height:208px">
      <button data-umg-name="Btn_MuzzleSlot" data-slot-state="empty" data-socket="muzzle" style="width:68px; height:68px; background-color:#3C3C3C; border:2px solid #FFFFFF"><img src="../assets/attachment-muzzle.png" alt="총구 부착물 실루엣" style="width:60px; height:60px; opacity:0.72"></button>
      <button data-umg-name="Btn_GripSlot" data-slot-state="empty" data-socket="grip" style="width:68px; height:68px; background-color:#3C3C3C; border:2px solid #FFFFFF"><img src="../assets/attachment-grip.png" alt="손잡이 부착물 실루엣" style="width:60px; height:60px; opacity:0.72"></button>
      <button data-umg-name="Btn_MagSlot" data-slot-state="empty" data-socket="mag" style="width:68px; height:68px; background-color:#3C3C3C; border:2px solid #FFFFFF"><img src="../assets/attachment-mag.png" alt="탄창 부착물 실루엣" style="width:60px; height:60px; opacity:0.72"></button>
      <button data-umg-name="Btn_ScopeSlot" data-slot-state="empty" data-socket="scope" style="width:68px; height:68px; background-color:#3C3C3C; border:2px solid #FFFFFF"><img src="../assets/attachment-scope.png" alt="조준경 부착물 실루엣" style="width:60px; height:60px; opacity:0.72"></button>
      <button data-umg-name="Btn_StockSlot" data-slot-state="empty" data-socket="stock" style="width:68px; height:68px; background-color:#3C3C3C; border:2px solid #FFFFFF"><img src="../assets/attachment-stock.png" alt="개머리판 부착물 실루엣" style="width:60px; height:60px; opacity:0.72"></button>
      <button disabled aria-hidden="true" style="width:68px; height:68px; background-color:#3C3C3C; border:2px solid #666666"></button>
    </div>
    <div style="display:flex; flex-direction:column; flex:1; height:208px; padding:3px 6px; gap:2px; overflow:hidden">
      <div style="display:flex; flex-direction:row; height:26px; align-items:center; gap:6px">
        <p data-umg-name="Txt_WeaponName" style="margin:0; font-family:'PUBG Headline'; font-size:20px; font-weight:700; color:#FFFFFF">M16</p>
        <p data-umg-name="Txt_WeaponClass" style="margin:0; padding:1px 4px; font-family:'PUBG Headline'; font-size:12px; font-weight:700; color:#FFFFFF; background-color:#080808">돌격소총</p>
      </div>
      <div data-umg-name="Box_AmmoSummary" style="display:flex; flex-direction:row; height:28px; gap:3px; align-items:center">
        <p data-umg-name="Txt_LoadedAmmo" style="margin:0; font-family:'PUBG Headline'; font-size:20px; font-weight:700; color:#FFFFFF">21</p>
        <p data-umg-name="Txt_ReserveAmmo" style="margin:0; font-family:'PUBG Headline'; font-size:11px; color:#C8C8C8">40</p>
        <img data-umg-name="Img_AmmoType" src="../assets/ammo-556.png" alt="5.56mm 탄약" style="width:28px; height:28px">
      </div>
      <img data-umg-name="Img_Weapon" src="../assets/weapon-m16.png" alt="Horizontal M16" style="width:345px; height:140px; object-fit:cover">
    </div>
  </div>
</div>
